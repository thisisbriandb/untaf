<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; width: 300px; padding: 16px; background: #FAFAF8; color: #161615; font-size: 13px; line-height: 1.45; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .eyes { display: inline-flex; gap: 5px; align-items: center; justify-content: center; width: 32px; height: 32px;
    border-radius: 999px; background: #ECF4F0; box-shadow: inset 0 0 0 1px rgba(0,96,69,.15); }
  .eye { width: 8px; height: 8px; border-radius: 999px; border: 1.5px solid #006045; box-shadow: 0 0 6px rgba(0,96,69,.35); }
  h1 { font-size: 15px; font-weight: 500; margin: 0; }
  .sub { font-size: 12px; color: rgba(26,25,24,.6); margin: 0; }
  .job { margin: 0 0 8px; }
  button { width: 100%; margin-top: 8px; padding: 9px 12px; border-radius: 999px; border: 0; cursor: pointer;
    font-size: 12.5px; background: #006045; color: #fff; }
  button:hover { background: #004d37; }
  button.ghost { background: transparent; color: #161615; border: 1px solid rgba(26,25,24,.15); }
  button:disabled { opacity: .55; cursor: default; }
  .msg { margin: 10px 0 0; font-size: 12px; color: rgba(26,25,24,.75); white-space: pre-line; }
  .msg.warn { color: #9A4B00; }
  footer { margin-top: 14px; font-size: 11px; color: rgba(26,25,24,.5); }
</style>
</head>
<body>
  <header>
    <span class="eyes"><span class="eye"></span><span class="eye"></span></span>
    <div><h1>Alice</h1><p class="sub" id="who">…</p></div>
  </header>
  <p class="job" id="job"></p>
  <div id="actions"></div>
  <p class="msg" id="msg"></p>
  <footer>Alice remplit, tu envoies : rien ne part sans ton clic.</footer>
  <script src="popup.js"></script>
</body>
</html>
