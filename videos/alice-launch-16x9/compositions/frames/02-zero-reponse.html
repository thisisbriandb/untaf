    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const $ = (id) => document.getElementById(id);

        const PEAK = 24;
        const MOVE_DUR = 0.45;
        const EASE = "expo.out";

        // Directional streak proxies (motion-blur-streak, Path A) — seeded at PEAK.
        function streak(nodeId, axis) {
          const node = $(nodeId);
          const p = { v: PEAK };
          const write = () => node.setAttribute("stdDeviation", axis === "x" ? p.v + " 0" : "0 " + p.v);
          write();
          return { p, write };
        }
        const b1 = streak("f02-blur1", "x");
        const b2 = streak("f02-blur2", "x");
        const b3 = streak("f02-blur3", "y");

        const l2 = $("f02-l2");
        const l3 = $("f02-l3");

        // ---- Scene 1 (0.0–0.8): fly in from the right, resolve sharp; strike draws.
        tl.fromTo(l1, { x: 1400, opacity: 0, scale: 1, filter: "blur(0px)" },
          { x: 0, opacity: 1, duration: MOVE_DUR, ease: EASE }, 0.02);
        tl.to(b1.p, { v: 0, duration: MOVE_DUR, ease: EASE, onUpdate: b1.write }, 0.02);
        tl.fromTo($("f02-s1"), { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "power2.out" }, 0.48);

        // ---- Scene 2 (0.8–1.6): line 1 zooms past camera + blurs; line 2 flies in from the left.
        tl.to(l1, { scale: 2.6, opacity: 0, filter: "blur(18px)", duration: 0.32, ease: "power2.in" }, 0.8);
        tl.fromTo(l2, { x: -1400, opacity: 0, scale: 1, filter: "blur(0px)" },
          { x: 0, opacity: 1, duration: MOVE_DUR, ease: EASE }, 0.86);
        tl.to(b2.p, { v: 0, duration: MOVE_DUR, ease: EASE, onUpdate: b2.write }, 0.86);
        tl.fromTo($("f02-s2"), { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "power2.out" }, 1.3);

        // ---- Scene 3 (1.6–2.4): line 2 zooms past; line 3 flies in from below and lands.
        tl.to(l2, { scale: 2.6, opacity: 0, filter: "blur(18px)", duration: 0.32, ease: "power2.in" }, 1.6);
        tl.fromTo(l3, { y: 600, opacity: 0 },
          { y: 0, opacity: 1, duration: MOVE_DUR, ease: EASE }, 1.66);
        tl.to(b3.p, { v: 0, duration: MOVE_DUR, ease: EASE, onUpdate: b3.write }, 1.66);

        // ---- Scene 4 (2.4–4.0): hard cut to the slam.
        tl.set(l3, { opacity: 0 }, 2.4);
        tl.fromTo($("f02-zero"),
          { scale: 3.2, opacity: 0, filter: "blur(22px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "power4.in" }, 2.4);
        // short low-amplitude impact jitter, then dead still

        tl.to(zw, { x: -4, y: 3, duration: 0.03, ease: "none" }, 2.72);
