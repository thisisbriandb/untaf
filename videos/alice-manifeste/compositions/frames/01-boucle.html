  <script>
    (function () {
      // Labyrinthe orthogonal déterministe : une cellule = un trait horizontal ou vertical.
      const svg = document.getElementById("b1-maze");
      const NS = "http://www.w3.org/2000/svg";
      const cell = 60;
      const hash = (i, j) => { let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
      for (let j = 0; j < 1920 / cell; j++) {
        for (let i = 0; i < 1080 / cell; i++) {
          const x = i * cell, y = j * cell, r = hash(i, j);
          const line = document.createElementNS(NS, "line");
          if (r < 0.5) { line.setAttribute("x1", x); line.setAttribute("y1", y); line.setAttribute("x2", x + cell); line.setAttribute("y2", y); }
          else { line.setAttribute("x1", x); line.setAttribute("y1", y); line.setAttribute("x2", x); line.setAttribute("y2", y + cell); }
          line.setAttribute("stroke", r > 0.93 ? "#5A5853" : "#3A3936");
          line.setAttribute("stroke-width", "4");
          line.setAttribute("stroke-linecap", "square");
          line.setAttribute("class", "b1-seg");
          svg.appendChild(line);
        }
