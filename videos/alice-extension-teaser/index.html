<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FAFAF8;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FAFAF8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-teaser"
        class="scene"
        data-composition-id="teaser"
        data-composition-src="compositions/index.html"
        data-start="0"
        data-duration="12"
        data-track-index="0"
      ></div>
      <audio
        id="el-teaser-audio"
        src="assets/audio/teaser-mix.wav"
        data-start="0"
        data-duration="12"
        data-track-index="11"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var mainTl = gsap.timeline({ paused: true });
      mainTl.to({}, { duration: 12 }, 0); // full-span anchor
      window.__timelines["main"] = mainTl;
      mainTl.seek(0);
    </script>
  </body>
</html>
