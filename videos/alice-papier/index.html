      function rng(seed) {

        }

      const SW = 2.1, SH = 2.97;
      const geo = new THREE.PlaneGeometry(SW, SH, 84, 120);

      const env = new THREE.Group(); carrier.add(env);

      {

        const u = B === A ? 0 : ease(Math.min(Math.max((t - A[0]) / (B[0] - A[0]), 0), 1));
        const cx = mix(A[1], B[1], u), cy = mix(A[2], B[2], u), dist = mix(A[3], B[3], u), tilt = mix(A[4], B[4], u);
        camera.position.set(cx, cy - dist * Math.sin(tilt), dist * Math.cos(tilt));
        camera.lookAt(cx, cy, 0);
      }

      // Le stylo arrive d'en bas à droite, écrit, puis se relève.
      function penAt(t, tb) {
        const tip = tipAt(t);
        const x = (tip.x / TW - 0.5) * SW, y = (0.5 - tip.y / TH) * SH;
        const enter = 1 - Math.pow(1 - Math.min(Math.max((t - S1 - 1.85) / 0.9, 0), 1), 3);
        const exit = sm(10.5, 11.15, tb);
        const lift = 0.045 * tip.up + (1 - enter) * 0.22 + exit * 0.25;
        pen.position.set(x + (1 - enter) * 2.2 + exit * 2.8, y - (1 - enter) * 2.4 - exit * 2.6, flatZ(x, y) + 0.004 + lift);
        pen.rotation.set(0.02 * Math.sin(t * 5.3), 0.025 * Math.sin(t * 3.7 + 1), 0.04 * Math.sin(t * 2.1));
        pen.visible = t - S1 > 1.85 && tb < 11.2;
      }

      function renderAt(t) {
        lastT = t;
        const tb = t - S2;
        shape(tb);
        envelopeAt(tb);
        flockAt(tb);
        searchAt(t);
        inkAt(t, tb);
        penAt(t, tb);
        frame(t);
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
