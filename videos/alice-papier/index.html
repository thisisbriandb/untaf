    <script type="module">
      import * as THREE from "./assets/vendor/three.module.min.js";

      // ---------- hasard déterministe ----------
      function rng(seed) {
        return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      }

      // ---------- texture de papier (fibres + grain) et relief ----------
      const TW = 1024, TH = 1448;
      function paperCanvases() {
        const r = rng(20261020);
        const height = new Float32Array(TW * TH);
        // grain fin
        for (let i = 0; i < height.length; i++) height[i] = (r() - 0.5) * 0.35;
        // fibres : courts traits orientés au hasard
        for (let k = 0; k < 9000; k++) {
          let x = r() * TW, y = r() * TH; const a = r() * Math.PI, len = 6 + r() * 26, s = (r() - 0.4) * 0.9;
          for (let j = 0; j < len; j++) {
            const xi = x | 0, yi = y | 0;
            if (xi >= 0 && yi >= 0 && xi < TW && yi < TH) height[yi * TW + xi] += s;
            x += Math.cos(a); y += Math.sin(a);

        }
        // flou léger 3x3
        const h2 = new Float32Array(height.length);
        for (let y = 1; y < TH - 1; y++) for (let x = 1; x < TW - 1; x++) {
          let s = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += height[(y + dy) * TW + x + dx];
          h2[y * TW + x] = s / 9;
        }
        const col = document.createElement("canvas"); col.width = TW; col.height = TH;
        const nor = document.createElement("canvas"); nor.width = TW; nor.height = TH;
        const ci = col.getContext("2d").createImageData(TW, TH), ni = nor.getContext("2d").createImageData(TW, TH);
        for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
          const i = y * TW + x, h = h2[i];
          const v = 246 + h * 10;
          ci.data[i * 4] = v; ci.data[i * 4 + 1] = v - 1.5; ci.data[i * 4 + 2] = v - 5; ci.data[i * 4 + 3] = 255;
          const hx = h2[y * TW + Math.min(x + 1, TW - 1)] - h2[y * TW + Math.max(x - 1, 0)];
          const hy = h2[Math.min(y + 1, TH - 1) * TW + x] - h2[Math.max(y - 1, 0) * TW + x];
          const k = 1.6, nx = -hx * k, ny = -hy * k, nz = 1, l = Math.hypot(nx, ny, nz);

        }

      }
      const { col, nor } = paperCanvases();
      // L'encre s'écrit sur une copie de la texture, redessinée à chaque image (seek-safe).
      const ink = document.createElement("canvas"); ink.width = TW; ink.height = TH;
      const ictx = ink.getContext("2d");
      const STROKES = window.STROKES.strokes;
      const typed = new Image(); typed.src = "assets/letter/typed.png";
      let lastT = 0;
      typed.onload = () => renderAt(lastT);
      function inkAt(t) {
        ictx.drawImage(col, 0, 0);
        // La lettre se réécrit de haut en bas pendant que les morceaux se rejoignent.
        const sweep = Math.min(Math.max((t - REWRITE[0]) / (REWRITE[1] - REWRITE[0]), 0), 1) * TH;
        if (sweep > 0 && typed.complete && typed.naturalWidth) {
          ictx.save(); ictx.beginPath(); ictx.rect(0, 0, TW, sweep); ictx.clip(); ictx.drawImage(typed, 0, 0, TW, TH); ictx.restore();
        }
        ictx.save(); ictx.beginPath(); ictx.rect(0, sweep, TW, TH - sweep); ictx.clip();
        ictx.lineCap = "round"; ictx.lineJoin = "round";
        for (const s of STROKES) {

          for (let j = 1; j < P.length && s.len[j - 1] < L; j++) {
            let [x1, y1] = P[j];

            // bille : un trait fin, la pression varie un peu le long du tracé

          }
        }

        }

        for (let i = 0; i < STROKES.length; i++) {
          const s = STROKES[i];

            const u = (t - STROKES[i - 1].t1) / (s.t0 - STROKES[i - 1].t1), e = u * u * (3 - 2 * u);
            return { x: a[0] + (b[0] - a[0]) * e, y: a[1] + (b[1] - a[1]) * e, up: Math.sin(u * Math.PI) * Math.min(Math.hypot(b[0] - a[0], b[1] - a[1]) / 60, 1) };
          }

            let j = 1; while (j < s.len.length - 1 && s.len[j] < L) j++;
            const u = (L - s.len[j - 1]) / Math.max(s.len[j] - s.len[j - 1], 1e-6);
            return { x: s.pts[j - 1][0] + (s.pts[j][0] - s.pts[j - 1][0]) * u, y: s.pts[j - 1][1] + (s.pts[j][1] - s.pts[j - 1][1]) * u, up: 0 };

      const map = new THREE.CanvasTexture(ink); map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = 8;

      const JX = new Float32Array(TH), RAG2 = new Float32Array(TH);
      {
        const r = rng(99); let n = 0;
        for (let cy = 0; cy < TH; cy++) {

          JX[cy] = TW / 2 + (J((0.5 - cy / TH) * SH0) / SW0) * TW + n * 2.2 + (r() - 0.5) * 1.4;
          RAG2[cy] = r() * 1.8;

      function maskCanvas(left) {
        const c = document.createElement("canvas"); c.width = TW; c.height = TH;
        const g = c.getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, TW, TH); g.fillStyle = "#fff";
        for (let cy = 0; cy < TH; cy++) left ? g.fillRect(0, cy, JX[cy], 1) : g.fillRect(JX[cy], cy, TW - JX[cy], 1);
        return new THREE.CanvasTexture(c);
      }
      const maskL = maskCanvas(true), maskR = maskCanvas(false);

      // ---------- la feuille : A4, maillage aligné sur les plis ----------
      const SW = 2.1, SH = 2.97;
      const geo = new THREE.PlaneGeometry(SW, SH, 84, 120);
      const base = geo.attributes.position.array.slice();
      // Le dos de la feuille reste vierge : la face arrière lit la texture du papier sans encre.
      const backTex = new THREE.CanvasTexture(col); backTex.colorSpace = THREE.SRGBColorSpace;
      const paperMat = (alphaMap) => {
        const m = new THREE.MeshStandardMaterial({ map, normalMap, normalScale: new THREE.Vector2(0.55, 0.55),
          roughness: 0.92, metalness: 0, side: THREE.DoubleSide, alphaMap: alphaMap || null, alphaTest: alphaMap ? 0.5 : 0 });
        m.onBeforeCompile = (sh) => {
          sh.uniforms.uBack = { value: backTex };
          sh.fragmentShader = "uniform sampler2D uBack;\n" + sh.fragmentShader.replace("#include <map_fragment>",
            "vec4 sampledDiffuseColor = gl_FrontFacing ? texture2D( map, vMapUv ) : texture2D( uBack, vMapUv );\ndiffuseColor *= sampledDiffuseColor;");
        };
        return m;
      };
      const depthMat = (alphaMap) => new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, alphaMap, alphaTest: 0.5, side: THREE.DoubleSide });
      const matFull = paperMat(null), matL = paperMat(maskL), matR = paperMat(maskR);
      const depthL = depthMat(maskL), depthR = depthMat(maskR);
      const geoR = geo.clone();
      const sheet = new THREE.Mesh(geo, matFull), sheetR = new THREE.Mesh(geoR, matR);
      for (const m of [sheet, sheetR]) { m.castShadow = true; m.receiveShadow = true; }
      const carrier = new THREE.Group(); scene.add(carrier);       // emporte lettre + enveloppe au départ
      const group = new THREE.Group(); group.add(sheet, sheetR); carrier.add(group);
      const F = new Float32Array(base.length);                      // feuille pliée/dépliée, avant déchirure

      const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.16 }));
      ground.position.z = -0.035; ground.receiveShadow = true; scene.add(ground);

      // Ombre de contact : un halo très doux sous les bords, qui suit la taille de la feuille.
      const cs = document.createElement("canvas"); cs.width = 256; cs.height = 256;
      { const g = cs.getContext("2d"); g.filter = "blur(18px)"; g.fillStyle = "rgba(60,52,40,1)"; g.fillRect(40, 40, 176, 176); }
      const contactTex = new THREE.CanvasTexture(cs);
      const contact = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ map: contactTex, transparent: true, opacity: 0.2, depthWrite: false }));
      contact.position.z = -0.034; scene.add(contact);

      // Lumière d'ambiance pour les reflets (une grande fenêtre douce au-dessus, à gauche).
      {
        const ec = document.createElement("canvas"); ec.width = 512; ec.height = 256;
        const g = ec.getContext("2d");
        const grd = g.createLinearGradient(0, 0, 0, 256); grd.addColorStop(0, "#ffffff"); grd.addColorStop(0.5, "#d9d6cf"); grd.addColorStop(1, "#7c7a75");
        g.fillStyle = grd; g.fillRect(0, 0, 512, 256);
        g.fillStyle = "#ffffff"; g.filter = "blur(10px)"; g.fillRect(70, 30, 120, 70);
        const et = new THREE.CanvasTexture(ec); et.mapping = THREE.EquirectangularReflectionMapping; et.colorSpace = THREE.SRGBColorSpace;
        const pm = new THREE.PMREMGenerator(renderer);
        scene.environment = pm.fromEquirectangular(et).texture;
        scene.environmentIntensity = 0.35;
      }
      scene.add(new THREE.HemisphereLight(0xffffff, 0xe4e0d8, 2.3));
      const sun = new THREE.DirectionalLight(0xfffaf2, 1.9);
      sun.position.set(-4.2, 2.6, 3.6); sun.castShadow = true;
      sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.015;
      Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 });
      scene.add(sun);

      // ---------- le stylo : un stylo bille noir, tenu de la main droite ----------
      const pen = new THREE.Group();
      {
        const body = new THREE.Group();
        const black = new THREE.MeshPhysicalMaterial({ color: 0x1d1f26, roughness: 0.28, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 2.2 });
        const grip = new THREE.MeshStandardMaterial({ color: 0x2b2d33, roughness: 0.62, envMapIntensity: 1.6 });
        const steel = new THREE.MeshStandardMaterial({ color: 0xd6d8dc, roughness: 0.22, metalness: 1, envMapIntensity: 2.5 });
        const part = (geo, m, y) => { const o = new THREE.Mesh(geo, m); o.position.y = y; o.castShadow = true; body.add(o); };
        part(new THREE.ConeGeometry(0.011, 0.05, 24), steel, 0.025);
        body.children[0].rotation.x = Math.PI;
        part(new THREE.CylinderGeometry(0.036, 0.012, 0.16, 32), grip, 0.13);
        part(new THREE.CylinderGeometry(0.041, 0.038, 0.32, 32), grip, 0.37);
        part(new THREE.CylinderGeometry(0.043, 0.042, 0.88, 32), black, 0.97);
        part(new THREE.CylinderGeometry(0.039, 0.043, 0.06, 32), black, 1.44);
        part(new THREE.BoxGeometry(0.018, 0.42, 0.03), steel, 1.2); body.children[5].position.z = 0.052;
        const dir = new THREE.Vector3(0.36, -0.46, 0.81).normalize();
        body.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        pen.add(body);
      }
      scene.add(pen);

      // ---------- l'enveloppe : dos, poche (avec ses plis), rabat articulé ----------
      const env = new THREE.Group(); carrier.add(env);
      const flapPivot = new THREE.Group();
      {
        const EW = 2.36, EH = 1.2;
        const envMat = new THREE.MeshStandardMaterial({ color: 0xf1ece2, roughness: 0.9, normalMap, normalScale: new THREE.Vector2(0.4, 0.4), side: THREE.DoubleSide });
        const back = new THREE.Mesh(new THREE.PlaneGeometry(EW, EH), envMat); back.position.z = 0.0005;
        const pc = document.createElement("canvas"); pc.width = 1024; pc.height = 520;
        { const g = pc.getContext("2d"); g.fillStyle = "#f3eee5"; g.fillRect(0, 0, 1024, 520);
          g.strokeStyle = "rgba(90,80,60,0.10)"; g.lineWidth = 3;
          g.beginPath(); g.moveTo(0, 0); g.lineTo(512, 300); g.lineTo(1024, 0); g.stroke();
          g.beginPath(); g.moveTo(0, 520); g.lineTo(430, 270); g.moveTo(1024, 520); g.lineTo(594, 270); g.stroke(); }
        const pt = new THREE.CanvasTexture(pc); pt.colorSpace = THREE.SRGBColorSpace;

      const CREASES = [ { k: 0, c: -T3, s: 1 }, { k: 1, c: T3, s: -1 } ];
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      // Le rabat se lève franchement, se pose à plat, rebondit à peine.
      function opening(t, t0, d) {
        const u = Math.min(Math.max((t - t0) / d, 0), 1);
        const lift = u < 1 ? Math.PI * (1 - ease(u)) : 0;
        const b = Math.min(Math.max((t - t0 - d) / 0.28, 0), 1);
        return lift + (u >= 1 ? Math.sin(b * Math.PI) * 0.035 : 0);
      }
      const SCHEDULE = [ [1.02, 0.62], [0.55, 0.58] ]; // f1 (bas), f2 (haut) : [début, durée]

      // Bruit doux déterministe (ondulations du papier).
      const R = rng(7);
      const WAVES = Array.from({ length: 7 }, () => ({ fx: 0.6 + R() * 1.8, fy: 0.6 + R() * 1.8, ph: R() * 6.28, a: 0.0015 + R() * 0.0025 }));
      const wobble = (x, y) => WAVES.reduce((z, w) => z + w.a * Math.sin(w.fx * x * 3.1 + w.ph) * Math.sin(w.fy * y * 2.7 + w.ph * 0.7), 0);

      // Hauteur de la feuille à plat en un point (pour poser la pointe du stylo).
      function flatZ(x0, y0) {
        let z = wobble(x0, y0);
        for (const cr of CREASES) { const d = Math.abs(y0 - cr.c); z += cr.s * 0.07 * (Math.min(d, 0.5) - (Math.min(d, 0.5) ** 2) / 1.0); }
        return z;
      }
      // Un rabat se soulève en se courbant : l'angle croît vers la pointe (intégré le long du rabat, donc sans étirement).
      const STEP = 0.025;
      function arc(a, L) {
        const n = Math.ceil(L / STEP) + 2, ys = new Float32Array(n), zs = new Float32Array(n), th = new Float32Array(n);
        const B = 0.32 * Math.sin(Math.max(Math.min(a, Math.PI), 0));
        let y = 0, z = 0;
        for (let j = 0; j < n; j++) {
          const sj = j * STEP, t0 = a + B * Math.pow(Math.min(sj / L, 1), 2);
          th[j] = t0; ys[j] = y; zs[j] = z;
          const t1 = a + B * Math.pow(Math.min((sj + STEP) / L, 1), 2), tm = (t0 + t1) / 2;
          y += STEP * Math.cos(tm); z += STEP * Math.sin(tm);
        }
        return { ys, zs, th, n };
      }
      const LEN = [0.99, 0.99];

      // Repli en trois après la réécriture : le bas remonte, le haut se rabat.
      const REFOLD = [ [15.2, 0.45], [15.62, 0.45] ];
      const REWRITE = [13.7, 14.5];
      function angleAt(k, t) {
        const [f0, fd] = REFOLD[k];
        if (t >= f0) return Math.PI * ease(Math.min((t - f0) / fd, 1));
        return opening(t, SCHEDULE[k][0], SCHEDULE[k][1]);
      }

      // Paramètres de la déchirure : front qui descend, écart, angle, envol, puis retour.
      const sm = (a, b, x) => { const u = Math.min(Math.max((x - a) / (b - a), 0), 1); return u * u * (3 - 2 * u); };
      function tearParams(t) {
        const T0 = 11.55, T1 = 12.05, T2 = 12.6, R0 = 13.55, R1 = 14.3;
        if (t < T0 || t >= R1) return { on: false, yf: 9, phi: 0, d: 0, lift: 0 };
        const yf = 1.65 + (-1.9 - 1.65) * sm(T0, T1, t);
        const back = sm(R0, R1, t);
        const phi = (0.11 * sm(T0, T1, t) + 0.03 * sm(T1, T2, t)) * (1 - back);
        const d = (0.16 * sm(T0, T1, t) + 0.14 * sm(T1, T2, t)) * (1 - back);
        const lift = 0.09 * Math.sin(Math.PI * Math.min(Math.max((t - T0) / (T2 - T0), 0), 1)) + 0.11 * Math.sin(Math.PI * back);
        return { on: true, yf, phi, d, lift };
      }
      function tear(src, dst, side, tp) {
        const py = Math.max(Math.min(tp.yf, SH / 2), -SH / 2), px = J(py);
        for (let i = 0; i < src.length; i += 3) {
          let x = src[i], y = src[i + 1], z = src[i + 2];
          const w = sm(tp.yf - 0.25, tp.yf + 0.25, y);
          const th = -side * tp.phi * w, c = Math.cos(th), sn = Math.sin(th);
          const rx = x - px, ry = y - py;
          x = px + rx * c - ry * sn + side * tp.d * w;
          y = py + rx * sn + ry * c;
          z += tp.lift * w + 0.035 * w * (tp.phi / 0.14) * Math.exp(-Math.abs(src[i] - J(src[i + 1])) / 0.12);
          dst[i] = x; dst[i + 1] = y; dst[i + 2] = z;
        }
      }

      function shape(t) {
        const angles = [0, 1].map((k) => angleAt(k, t));
        const arcs = angles.map((a, k) => (Math.abs(a) > 1e-4 ? arc(a, LEN[k]) : null));
        const pos = F;
        for (let i = 0; i < pos.length; i += 3) {
          const x0 = base[i], y0 = base[i + 1];
          // Mémoire des plis : chaque pli ouvert garde un léger angle (10° environ), plus les ondulations du papier.
          const flat = Math.min(...angles.map((a) => 1 - Math.abs(a) / Math.PI));
          let z = wobble(x0, y0) * flat;
          for (const cr of CREASES) {
            const open = 1 - Math.abs(angles[cr.k]) / Math.PI;
            if (open <= 0) continue;
            const d = Math.abs(y0 - cr.c);
            z += cr.s * 0.07 * open * (Math.min(d, 0.5) - (Math.min(d, 0.5) ** 2) / 1.0);
          }
          let x = x0, y = y0;
          for (let k = 0; k < FOLDS.length; k++) {
            const A = arcs[k]; if (!A) continue;
            const f = FOLDS[k], h = f.gap;
            const ry = f.sgn * (y - f.c);
            if (ry > 1e-6) {
              const rz = z - h;
              const j = Math.min(Math.round(ry / STEP), A.n - 1);
              const ny = A.ys[j] - rz * Math.sin(A.th[j]), nz = A.zs[j] + rz * Math.cos(A.th[j]);
              y = f.c + f.sgn * ny;
              z = h + nz;
            }
          }
          pos[i] = x; pos[i + 1] = y; pos[i + 2] = z;
        }
        const tp = tearParams(t);
        const PL = geo.attributes.position.array, PR = geoR.attributes.position.array;
        if (tp.on) { tear(F, PL, 1 * -1, tp); tear(F, PR, 1, tp); } else PL.set(F);
        sheet.material = tp.on ? matL : matFull; sheet.customDepthMaterial = tp.on ? depthL : undefined;
        sheetR.visible = tp.on; sheetR.customDepthMaterial = depthR;
        for (const g of tp.on ? [geo, geoR] : [geo]) { g.attributes.position.needsUpdate = true; g.computeVertexNormals(); }
        // L'ombre de contact couvre la partie posée sur la table.
        let lo = Infinity, hi = -Infinity;
        for (let i = 0; i < pos.length; i += 3) if (pos[i + 2] < 0.03) { lo = Math.min(lo, pos[i + 1]); hi = Math.max(hi, pos[i + 1]); }
        contact.scale.set(SW * 1.45, (hi - lo) * 1.32 + SW * 0.12, 1);
        contact.position.set(0.035, (lo + hi) / 2 - 0.03, -0.034);
        contact.scale.x = SW * 1.45 + (tp.on ? tp.d * 2 : 0);
        contact.visible = t < 16.05;
      }

      // La lettre pliée monte, glisse dans l'enveloppe, le rabat se ferme, tout part.
      function envelopeAt(t) {
        const inE = 1 - Math.pow(1 - sm(16.0, 16.65, t), 2);
        env.position.set(0, -3.6 + (3.45) * inE, 0);
        const up = sm(16.1, 16.6, t), ins = sm(16.75, 17.25, t);
        group.position.set(0, 1.12 * up - 1.27 * ins, 0.008 * (up > 0 ? 1 : 0) + 0.05 * Math.sin(Math.PI * up) * (1 - ins));
        flapPivot.rotation.x = Math.PI * ease(Math.min(Math.max((t - 17.32) / 0.4, 0), 1));
        flapPivot.position.z = 0.003 + 0.031 * sm(17.32, 17.5, t);   // ouvert sous la lettre, fermé par-dessus la poche
        const go = Math.min(Math.max((t - 18.0) / 0.8, 0), 1), g2 = go * go * go;
        const press = Math.sin(Math.PI * Math.min(Math.max((t - 17.72) / 0.2, 0), 1)) * 0.006;
        carrier.position.set(5.2 * g2, 3.8 * g2, 0.5 * Math.sin(Math.PI * Math.min(go * 1.4, 1)) - press);
        carrier.rotation.z = -0.22 * g2;
        env.visible = t > 15.95;
      }

      // Caméra : plans fixes, reliés par quelques mouvements francs.
      const mix = (a, b, u) => a + (b - a) * u;
      const CAM = [ // t, cx, cy, distance, inclinaison
        [0, 0, 0.05, 8.6, 0.1], [1.9, 0, 0.05, 8.6, 0.1], [3.2, 0.02, 0.33, 5.4, 0.2],
        [10.55, 0.02, 0.33, 5.4, 0.2], [11.45, 0, 0.0, 9.4, 0.1], [12.55, 0, 0.0, 9.4, 0.1], [13.4, 0, -0.12, 10.5, 0.1],
      ];
      function frame(t) {
        let k = CAM.length - 1;
        for (let i = 0; i < CAM.length - 1; i++) if (t < CAM[i + 1][0]) { k = i; break; }
        const A = CAM[k], B = CAM[Math.min(k + 1, CAM.length - 1)];
        const u = B === A ? 0 : ease(Math.min(Math.max((t - A[0]) / (B[0] - A[0]), 0), 1));
        const cx = mix(A[1], B[1], u), cy = mix(A[2], B[2], u), dist = mix(A[3], B[3], u), tilt = mix(A[4], B[4], u);
        camera.position.set(cx, cy - dist * Math.sin(tilt), dist * Math.cos(tilt));
        camera.lookAt(cx, cy, 0);
      }

      // Le stylo arrive d'en bas à droite, écrit, puis se relève.
      function penAt(t) {
        const tip = tipAt(t);
        const x = (tip.x / TW - 0.5) * SW, y = (0.5 - tip.y / TH) * SH;
        const enter = 1 - Math.pow(1 - Math.min(Math.max((t - 1.85) / 0.9, 0), 1), 3);
        const exit = sm(10.5, 11.15, t);
        const lift = 0.045 * tip.up + (1 - enter) * 0.22 + exit * 0.25;
        pen.position.set(x + (1 - enter) * 2.2 + exit * 2.8, y - (1 - enter) * 2.4 - exit * 2.6, flatZ(x, y) + 0.004 + lift);
        pen.rotation.set(0.02 * Math.sin(t * 5.3), 0.025 * Math.sin(t * 3.7 + 1), 0.04 * Math.sin(t * 2.1));
        pen.visible = t > 1.85 && t < 11.2;
      }

      function renderAt(t) {
        lastT = t;
        shape(t);
        envelopeAt(t);
        inkAt(t);
        penAt(t);
        frame(t);
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
