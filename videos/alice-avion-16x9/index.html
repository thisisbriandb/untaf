      const cvTex = new THREE.CanvasTexture(cvCanvas); cvTex.colorSpace = THREE.SRGBColorSpace; cvTex.anisotropy = 8;
      const cv = new THREE.Mesh(geoCV, paperMat(cvTex));
      for (const m of [letter, letterR, cv]) { m.castShadow = m.receiveShadow = true; planeG.add(m); }
      letterR.customDepthMaterial = depthR;

      // ---------- images : lettre réécrite, blocs du CV ----------
      let lastT = 0;
      const img = (src) => { const i = new Image(); i.src = src; i.onload = () => { inkKey.fill(-1); cvKey = -1; renderAt(lastT); }; return i; };
      const typed = img("assets/letter/typed.png");
      const CVB = { header: img("assets/cv/header.png"), skills: img("assets/cv/skills.png"), skillsG: img("assets/cv/skillsG.png"), exp: img("assets/cv/exp.png"), edu: img("assets/cv/edu.png") };
      const ok = (i) => i.complete && i.naturalWidth > 0;

      const REWRITE = [8.45, 9.25];
      const inkKey = [-1, -1, -1, -1];
      function inkAt(t) {
        for (let k = 0; k < 4; k++) {
          const tt = Math.min(t, SHEET_END[k] + 0.01);
          const sweep = k === 3 ? clamp01((t - REWRITE[0]) / (REWRITE[1] - REWRITE[0])) : 0;
          const tp = k === 3 ? tearParams(t) : { on: false };
          const front = tp.on ? Math.min((0.5 - tp.yf / SH) * TH, TH) : 0;
          const key = tt * 1000 + sweep * 7 + front * 0.001 + (ok(typed) ? 0.5 : 0);
          if (key === inkKey[k]) continue;
          inkKey[k] = key;
          const ctx = inkCanvas[k].getContext("2d");
          ctx.drawImage(col, 0, 0);
          const sw = sweep * TH;
          if (sw > 0 && ok(typed)) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, TW, sw); ctx.clip(); ctx.drawImage(typed, 0, 0, TW, TH); ctx.restore(); }
          ctx.save(); ctx.beginPath(); ctx.rect(0, sw, TW, TH - sw); ctx.clip(); drawStrokes(ctx, k, tt); ctx.restore();
          if (front > 0) { ctx.fillStyle = "rgba(255,255,253,0.9)"; for (let cy = 0; cy < front; cy++) ctx.fillRect(JX[cy] - 2.5 - RAG[cy], cy, 5 + RAG[cy] * 2, 1); }
          inkTex[k].needsUpdate = true;
        }
      }
      // Le CV s'adapte : les compétences demandées remontent en tête et passent au vert.
      let cvKey = -1;
      function cvAt(t) {
        const u = ez(10.05, 10.85, t), g = sm(10.3, 10.85, t), key = u * 1000 + g + (ok(CVB.exp) ? 0.5 : 0);
        if (key === cvKey) return; cvKey = key;
        const c = cvCanvas.getContext("2d"); c.drawImage(col, 0, 0);
        const B = window.CV_BLOCKS, gap = 22, y0 = 104;
        const start = { exp: y0 + B.header + gap, edu: y0 + B.header + gap + B.exp + gap }; start.skills = start.edu + B.edu + gap;
        const end = { skills: y0 + B.header + gap }; end.exp = end.skills + B.skills + gap; end.edu = end.exp + B.exp + gap;
        const y = (k) => mix(start[k], end[k], u);
        if (ok(CVB.header)) c.drawImage(CVB.header, 0, y0);
        if (ok(CVB.exp)) c.drawImage(CVB.exp, 0, y("exp"));
        if (ok(CVB.edu)) c.drawImage(CVB.edu, 0, y("edu"));
        if (ok(CVB.skills)) { c.globalAlpha = 1 - g; c.drawImage(CVB.skills, 0, y("skills")); }
        if (ok(CVB.skillsG)) { c.globalAlpha = g; c.drawImage(CVB.skillsG, 0, y("skills")); }
        c.globalAlpha = 1;
        cvTex.needsUpdate = true;
      }

      // ---------- le pliage en avion (la lettre et le CV ensemble) ----------
      const r45 = Math.SQRT1_2, s22 = Math.sin(Math.PI / 8), c22 = Math.cos(Math.PI / 8), TIP = SH / 2;
      const FOLDS = [ // point, direction, point du côté qui se plie, hauteur de l'axe, [début, durée]
        { a: [0, TIP], d: [-r45, -r45], s: [-1.0, 1.45], h: 0.01, T: [11.5, 0.28] },
        { a: [0, TIP], d: [r45, -r45], s: [1.0, 1.45], h: 0.01, T: [11.78, 0.28] },
        { a: [0, TIP], d: [-s22, -c22], s: [-0.98, -0.6], h: 0.03, T: [12.06, 0.28] },
        { a: [0, TIP], d: [s22, -c22], s: [0.98, -0.6], h: 0.03, T: [12.34, 0.28] },
      ];
      for (const f of FOLDS) {
        const rx = f.s[0] - f.a[0], ry = f.s[1] - f.a[1], dot = rx * f.d[0] + ry * f.d[1];
        const nx = rx - dot * f.d[0], ny = ry - dot * f.d[1], l = Math.hypot(nx, ny); f.n = [nx / l, ny / l];
        if (f.d[0] * f.n[1] - f.d[1] * f.n[0] < 0) f.d = [-f.d[0], -f.d[1]];   // l'axe tourne de façon à soulever le rabat
      }
      const VFOLD = [12.62, 0.45], WROOT = 0.2;
      const foldEase = (t, [t0, d]) => ease(clamp01((t - t0) / d));
      function fold(src, dst, zLayer, t) {
        const ang = FOLDS.map((f) => Math.PI * foldEase(t, f.T));
        const vp = foldEase(t, VFOLD), beta = 1.32 * vp, thw = -beta + (beta + 0.12) * vp;
        for (let i = 0; i < src.length; i += 3) {
          let x = src[i], y = src[i + 1], z = src[i + 2] + zLayer;
          for (let k = 0; k < 4; k++) {
            if (ang[k] < 1e-4) break;
            const f = FOLDS[k], rx = x - f.a[0], ry = y - f.a[1];
            if (rx * f.n[0] + ry * f.n[1] <= 1e-6) continue;
            const par = rx * f.d[0] + ry * f.d[1], px = rx - par * f.d[0], py = ry - par * f.d[1], pz = z - f.h;
            const c = Math.cos(ang[k]), s = Math.sin(ang[k]);
            const cx = f.d[1] * pz, cy = -f.d[0] * pz, cz = f.d[0] * py - f.d[1] * px;   // d × perp
            x = f.a[0] + par * f.d[0] + px * c + cx * s; y = f.a[1] + par * f.d[1] + py * c + cy * s; z = f.h + pz * c + cz * s;
          }
          if (vp > 0) {
            const sg = x < 0 ? -1 : 1, u = Math.abs(x);
            if (u < WROOT) { x = sg * (u * Math.cos(beta) + z * Math.sin(beta)); z = -u * Math.sin(beta) + z * Math.cos(beta); }
            else { const v = u - WROOT; x = sg * (WROOT * Math.cos(beta) + v * Math.cos(thw) - z * Math.sin(thw)); z = -WROOT * Math.sin(beta) + v * Math.sin(thw) + z * Math.cos(thw); }
          }
          dst[i] = x; dst[i + 1] = y; dst[i + 2] = z;
        }
      }
      const tmp = new Float32Array(base3.length);
      function letterAt(t) {
        const tp = tearParams(t), PL = geoL.attributes.position.array, PR = geoR.attributes.position.array, PC = geoCV.attributes.position.array;
        if (tp.on) { tear(base3, PL, -1, tp); tear(base3, PR, 1, tp); }
        else { fold(base3, PL, 0.0, t); }
        fold(base3, PC, -0.012, t);
        letter.material = tp.on ? matL : matFull; letter.customDepthMaterial = tp.on ? depthL : undefined; letterR.visible = tp.on;
        for (const g of tp.on ? [geoL, geoR, geoCV] : [geoL, geoCV]) { g.attributes.position.needsUpdate = true; g.computeVertexNormals(); }
        // la lettre et le CV : flotter, se séparer, se rejoindre
        const float = sm(6.95, 7.6, t) * (1 - sm(9.0, 9.45, t));
        const sep = ez(9.4, 9.95, t) * (1 - ez(11.05, 11.45, t));
        for (const m of [letter, letterR]) m.position.set(-1.15 * sep, 0, 0.55 * float + 0.05 * Math.sin(t * 1.3) * float);
        cv.position.set(1.15 * sep, 0, 0);
        cv.visible = t > 9.3;
      }

      // ---------- le vol : l'avion décolle, d'autres le rejoignent, chacun vers une offre ----------
      const YR = 10.5, SLOTS = [];
      for (const side of [-1, 1]) for (let k = 0; k < 8; k++) { const a = (2 * Math.PI * k) / 8 + Math.PI / 8; SLOTS.push([side * 2.6 + 1.85 * Math.cos(a), YR + 1.85 * Math.sin(a)]); }
      const dotMat = SLOTS.map(() => new THREE.MeshBasicMaterial({ color: 0xd9d5cc, transparent: true, opacity: 0 }));
      const dots = SLOTS.map((s, i) => { const m = new THREE.Mesh(new THREE.CircleGeometry(0.13, 40), dotMat[i]); m.position.set(s[0], s[1], -0.03); scene.add(m); return m; });
      const halo = SLOTS.map((s) => { const m = new THREE.Mesh(new THREE.RingGeometry(0.13, 0.17, 48), new THREE.MeshBasicMaterial({ color: 0x006045, transparent: true, opacity: 0 })); m.position.set(s[0], s[1], -0.029); scene.add(m); return m; });
      const GREY = new THREE.Color(0xd9d5cc), GREEN = new THREE.Color(0x006045);
      // la forme finale de l'avion, copiée pour la flotte
      const planeGeo = sheetGeo(); fold(base3, planeGeo.attributes.position.array, 0, 99); planeGeo.computeVertexNormals();
      const R2 = rng(42), flock = [];
      const ORDER = [3, 12, 1, 14, 6, 9, 0, 15, 4, 11, 2, 13];   // offre visée par chaque avion (0 = l'avion principal)
      for (let i = 1; i < ORDER.length; i++) {
        const m = new THREE.Mesh(planeGeo, paperMat(backTex)); m.castShadow = true; m.visible = false; scene.add(m);
        const side = i % 2 ? 1 : -1, rank = Math.ceil(i / 2);
        flock.push({ m, slot: ORDER[i], fx: side * 1.25 * rank, fy: -1.0 * rank, fz: 0.08 * rank, sx: side * (4 + R2() * 3), sy: -6 - R2() * 3, sz: 2 + R2() * 2,
          t0: 13.7 + i * 0.09, peel: 15.0 + i * 0.1, ph: R2() * 6.28 });
      }
      // trajectoire de l'avion principal
      function mainPath(t) {
        const lift = ez(13.05, 13.6, t), fly = ez(13.5, 16.1, t);
        const p = new THREE.Vector3(0.3 * Math.sin(fly * 3.4) * fly, 0.1 + 8.6 * fly, 0.25 * sm(12.62, 13.05, t) + 1.5 * lift + 0.6 * Math.sin(fly * Math.PI));
        const dive = ez(16.0, 16.75, t), s = SLOTS[ORDER[0]];
        p.x = mix(p.x, s[0], dive); p.y = mix(p.y, s[1], dive); p.z = mix(p.z, 0.0, dive);
        return { p, lift, fly, dive };
      }
      function flightAt(t) {
        const { p, lift, fly, dive } = mainPath(t);
        if (t >= 13.05) {
          planeG.position.copy(p);
          planeG.rotation.set(0.12 * lift * (1 - dive) - 0.5 * dive, 0.22 * Math.sin(fly * 4.2) * fly, -0.25 * Math.sin(fly * 3.4) * fly * 0.4);
          planeG.scale.setScalar(1 - 0.45 * fly - 0.3 * dive);
          planeG.visible = dive < 0.98;
        }
        const lit = (i, tl) => { const g = sm(tl, tl + 0.25, t); dotMat[i].color.copy(GREY).lerp(GREEN, g); halo[i].material.opacity = 0.6 * Math.sin(Math.PI * clamp01((t - tl) / 0.7)); halo[i].scale.setScalar(1 + 1.6 * clamp01((t - tl) / 0.7)); dots[i].scale.setScalar(1 + 0.35 * Math.sin(Math.PI * clamp01((t - tl) / 0.35))); };
        const out = 1 - sm(17.7, 18.0, t);   // les anneaux 2D prennent le relais
        SLOTS.forEach((s, i) => { dotMat[i].opacity = 0.85 * sm(14.4 + i * 0.05, 14.8 + i * 0.05, t) * out; dots[i].visible = halo[i].visible = out > 0; });
        lit(ORDER[0], 16.75);
        for (const f of flock) {
          const a = sm(f.t0, f.t0 + 1.1, t), pe = ez(f.peel, f.peel + 0.85, t), s = SLOTS[f.slot];
          const fx = p.x + f.fx, fy = p.y + f.fy, fz = Math.max(p.z, 0.9) + f.fz;
          let x = mix(p.x + f.sx, fx, a), y = mix(p.y + f.sy, fy, a), z = mix(f.sz, fz, a);
          x = mix(x, s[0], pe); y = mix(y, s[1], pe); z = mix(z, 0.0, pe);
          f.m.position.set(x, y, z);
          f.m.rotation.set(0.1 - 0.5 * pe + 0.05 * Math.sin(t * 5 + f.ph), 0.18 * Math.sin(t * 3 + f.ph) * (1 - pe), Math.atan2(-(s[0] - fx), s[1] - fy) * pe * 0.6);
          f.m.scale.setScalar(0.55 * (1 - 0.4 * pe));
          f.m.visible = t > f.t0 && pe < 0.98;
          lit(f.slot, f.peel + 0.85);
        }
        // les offres restantes s'allument d'elles-mêmes
        const used = new Set(ORDER);
        SLOTS.forEach((s, i) => { if (!used.has(i)) lit(i, 16.85 + (i % 4) * 0.08); });
      }

      // ---------- feuilles 35 à 37 : arrivée, écriture, départ vers la pile ----------
      function sheetsAt(t) {
        for (let k = 0; k < 3; k++) {
          const [a0, a1, d0, d1] = SCHED[k], m = sheets[k], [px, py, pz, pr] = PILE[k];
          const arr = a0 < 0 ? 1 : 1 - Math.pow(1 - clamp01((t - a0) / (a1 - a0)), 3), dep = ez(d0, d1, t);
          const gone = ez(8.0 + k * 0.06, 8.7 + k * 0.06, t);
          m.position.set(mix(3.4, 0, arr) + (px - 0) * dep - 5.6 * gone, py * dep, mix(0.03, pz, dep) + 0.06 * Math.sin(Math.PI * dep));
          m.rotation.z = pr * dep;
          m.visible = t >= a0;
        }
        // la 38e arrive, puis devient l'avion
        const a = 1 - Math.pow(1 - clamp01((t - 5.4) / 0.2), 3);
        if (t < 13.05) { planeG.position.set(mix(3.4, 0, a), 0, 0.03); planeG.rotation.set(0, 0, 0); planeG.scale.setScalar(1); planeG.visible = t >= 5.4; }
      }

      function penAt(t) {
        const tip = tipAt(t), x = (tip.x / TW - 0.5) * SW, y = (0.5 - tip.y / TH) * SH;
        const exit = ez(6.42, 6.9, t);
        pen.position.set(x + exit * 2.8, y - exit * 2.6, 0.03 + wobble(x, y) + 0.004 + 0.045 * tip.up + exit * 0.3);
        pen.rotation.set(0.02 * Math.sin(t * 5.3), 0.025 * Math.sin(t * 3.7 + 1), 0.04 * Math.sin(t * 2.1));
        pen.visible = t < 6.9;
      }

      // ---------- la caméra : une seule prise ----------
      const CAM = [ // t, cx, cy, distance, inclinaison
        [0, -0.75, 0.3, 6.9, 0.16], [6.4, -0.75, 0.3, 6.9, 0.16], [7.4, 0, 0.05, 7.6, 0.16], [9.3, 0, 0.05, 7.6, 0.16],
        [9.9, 0, 0, 7.6, 0.12], [11.0, 0, 0, 7.6, 0.12], [11.6, 0, 0.1, 7.4, 0.14], [13.05, 0, 0.1, 7.4, 0.14],
      ];
      function staticCam(t) {
        let k = CAM.length - 1;
        for (let i = 0; i < CAM.length - 1; i++) if (t < CAM[i + 1][0]) { k = i; break; }
        const A = CAM[k], B = CAM[Math.min(k + 1, CAM.length - 1)], u = A === B ? 0 : ease(clamp01((t - A[0]) / (B[0] - A[0])));
        return [1, 2, 3, 4].map((j) => mix(A[j], B[j], u));
      }
      function followCam(t) {   // derrière l'avion, un peu au-dessus, le regard vers les offres
        const { p, fly } = mainPath(Math.min(t, 16.0));
        return [p.x * 0.6, p.y + 0.9 + 1.0 * fly, mix(9.5, 12.5, fly), mix(0.2, 0.55, sm(0, 0.6, fly))];
      }
      const END = [0, YR, 17, 0.06];
      const target = new THREE.Vector3();
      function frame(t) {
        let c;
        if (t < 13.05) c = staticCam(t);
        else if (t < 16.0) { const a = staticCam(13.05), b = followCam(t), u = sm(13.05, 13.9, t); c = a.map((v, j) => mix(v, b[j], u)); }
        else { const a = followCam(16.0), u = ez(16.0, 17.55, t); c = a.map((v, j) => mix(v, END[j], u)); }
        const [cx, cy, dist, tilt] = c;
        camera.position.set(cx, cy - dist * Math.sin(tilt), dist * Math.cos(tilt));
        camera.lookAt(cx, cy, 0);
        target.set(cx, cy, 0);
        return dist;
      }

      function renderAt(t) {
        lastT = t;
        sheetsAt(t);
        letterAt(t);
        flightAt(t);
        inkAt(t);
        cvAt(t);
        penAt(t);
        const dist = frame(t);
        lightAt(t, target, dist > 20 ? 16 : dist > 10 ? 7 : 4.5);
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
