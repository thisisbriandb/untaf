  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "05-elle-travaille";
      var $ = function (s) { return document.getElementById("f05-" + s); };
      var words = function (s) { return Array.prototype.slice.call($(s).querySelectorAll('[class~="f05-w"]')); };

      var tl = gsap.timeline({ paused: true });
      var card = $("card");
      // card grows row by row: visible height = header (124) + rows * 110 (+ 30 padding)
      var H = 686;
      var reveal = function (h, t, d) {
        tl.to(card, { clipPath: "inset(0px 0px " + (H - h) + "px 0px round 34px)", duration: d || 0.45, ease: "power3.out" }, t);
      };
      tl.fromTo(card, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);

      // ---- Scene 1 (0.0–1.6s): counter 0 -> 1 284 ----
      var countEl = $("count");
      var fmt = function (n) {
        n = Math.round(n);
        if (n < 1000) return String(n);
        var r = String(n % 1000);
        while (r.length < 3) r = "0" + r;
        return Math.floor(n / 1000) + "\u00a0" + r;
      };
      var state = { v: 0 };
      countEl.textContent = "0";
      tl.fromTo($("count-wrap"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0);
      tl.fromTo(state, { v: 0 }, { v: 1284, duration: 1.2, ease: "power2.out",
        onUpdate: function () { countEl.textContent = fmt(state.v); } }, 0.1);
      tl.fromTo(countEl, { scale: 0.8 }, { scale: 1, duration: 1.2, ease: "power2.out" }, 0.1);
      tl.fromTo($("count-sub"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.3);

      // working pulse on the live dot (finite)
      var pulse = $("pulse"), ph = { p: 0 };
      tl.fromTo(ph, { p: 0 }, { p: 4, duration: 3.6, ease: "none", onUpdate: function () {
        var f = ph.p % 1; pulse.style.opacity = String(0.6 * (1 - f)); pulse.style.transform = "scale(" + (1 + f * 1.4) + ")"; } }, 0);
      tl.set(pulse, { opacity: 0 }, 3.6);

      var row = function (k, i, t) {
        reveal(124 + (i + 1) * 110 + 8, t);
        tl.fromTo($("r-" + k), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t + 0.05);
      };
      row("scan", 0, 0.75);
      row("retenue", 1, 1.2);

      // counter clears up
      tl.to($("count-wrap"), { y: -90, duration: 0.3, ease: "power4.in" }, 1.32);
      tl.to($("count-wrap"), { opacity: 0, duration: 0.2, ease: "power1.in" }, 1.42);

      // ---- caption line swaps ----
      var lineIn = function (key, t, axis) {
        var ws = words(key), gap = 0.05, at = t;
        ws.forEach(function (w) {
          var from = {}; from[axis] = axis === "x" ? 230 : 90;
          var to = { duration: 0.3, ease: "power4.out" }; to[axis] = 0;
          var pre = { opacity: 0 }; pre[axis] = from[axis];
          tl.set(w, pre, 0);
          tl.set(w, { opacity: 0.35 }, at);
          tl.fromTo(w, from, to, at);
          tl.to(w, { opacity: 1, duration: 0.3, ease: "power2.out" }, at);
          at += gap; gap *= 0.84;
        });
      };
      var lineOut = function (key, cut) {
        var ws = words(key), n = ws.length;
        ws.forEach(function (w, i) {
          var s0 = cut - 0.18 - (n - 1 - i) * 0.022;
          tl.to(w, { x: -230, duration: 0.34, ease: "power4.in" }, s0);
          tl.to(w, { opacity: 0, duration: 0.18, ease: "power1.in" }, s0);
        });
      };
      var check = function (k, t) {
        var b = $("b-" + k), p = b.querySelector("path"), len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        tl.fromTo(b, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, t);
        tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.14);
      };

      // ---- Scene 2 (1.6–2.6s): CV adapté ----
      lineIn("l-cv", 1.62, "y");
      row("cv", 2, 1.62);
      check("cv", 1.95);
      // ---- Scene 3 (2.6–3.6s): Lettre rédigée ----
      lineOut("l-cv", 2.62);
      lineIn("l-lettre", 2.62, "x");
      row("lettre", 3, 2.62);
      check("lettre", 2.92);
      // ---- Scene 4 (3.6–5.0s): Candidature envoyée + glow, hold ----
      lineOut("l-lettre", 3.62);
      lineIn("l-cand", 3.62, "x");
      row("cand", 4, 3.62);
      check("cand", 3.92);
      tl.fromTo($("glow"), { opacity: 0, scale: 0.5 }, { opacity: 0.5, scale: 1, duration: 0.5, ease: "power2.out" }, 3.82);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-elle-travaille"] = tl;
    })();
  </script>
