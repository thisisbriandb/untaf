      var ring = $("f08-ring");

      var tl = gsap.timeline({ paused: true });

      tl.fromTo(words, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.08 }, 0.1);

      // ── Scene 2 (1.2–2.2s): line clears; eyes condense at one center into the pill ──

      // eyes glide to the pill's center (46% height) so both share one transform-origin point
      tl.to(eyes, { y: 230, duration: 0.3, ease: "power2.inOut" }, 1.2);

      // ── Scene 3 (2.2–2.8s): the pill presses itself + one glow ring blooms outward ──

      tl.to(pill, { scale: 1, duration: 0.45, ease: "back.out(2)" }, 2.4);
      tl.fromTo(ring, { opacity: 0, scaleX: 1, scaleY: 1 }, { opacity: 0.45, duration: 0.08, ease: "none" }, 2.32);
      tl.to(ring, { opacity: 0, scaleX: 1.08, scaleY: 1.35, duration: 0.55, ease: "power2.out" }, 2.4);
