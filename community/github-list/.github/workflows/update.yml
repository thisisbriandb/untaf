# Met à jour la liste chaque jour à partir de l'API d'Alice.
# Variable de dépôt requise : ALICE_API_URL (ex. https://api.alice-agent.fr),
# dans Settings → Secrets and variables → Actions → Variables.
name: Mise à jour de la liste

on:
  schedule:
    - cron: "17 5 * * *" # chaque jour vers 7 h (heure de Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les listes
        env:
          API: ${{ vars.ALICE_API_URL }}
        run: |
          set -euo pipefail
          test -n "$API" || { echo "Variable ALICE_API_URL absente"; exit 1; }
          curl -fsS --retry 3 "$API/api/community/liste.md?kind=alternance" -o README.md.new
          curl -fsS --retry 3 "$API/api/community/liste.md?kind=stage" -o STAGES.md.new
          # Une réponse vide ou tronquée ne remplace jamais une liste valide.
          for f in README.md STAGES.md; do
            grep -q "Alice Community" "$f.new" && mv "$f.new" "$f" || { echo "$f invalide, conservé"; rm -f "$f.new"; }
          done

      - name: Publier si la liste a changé
        run: |
          git config user.name "alice-community-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md STAGES.md
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Offres du $(date -u +%d/%m/%Y)"
          git push
